[project]
name = "openbom"
version = "5.0.0"
description = "Open-source supply chain threat detection platform for Linux infrastructure"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
agent = ["httpx>=0.27", "rich>=13", "jinja2>=3.1", "packaging>=23"]
report = ["weasyprint>=60"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "sqlalchemy>=2.0", "aiosqlite>=0.20", "pydantic>=2.6"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*"]
